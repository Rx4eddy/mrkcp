name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Lint, Test, and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Sync DB Schema
        run: |
          npx prisma generate
          npx prisma db push

      - name: Seed Curated Problem Bank
        run: npm run db:seed

      - name: TypeScript Linting Check
        run: npm run lint

      - name: Run Automated Tests
        run: npm test

      - name: Build Full Production Bundle
        run: npm run build
